name: Sync Invariants

# WHY THIS WORKFLOW EXISTS
#
# An inbound loom sync PR merged and SILENTLY REVERTED three fixes that had
# landed on main hours earlier — a `wx` refusal + action digest in
# `cross-repo-authorize.mjs` (a receipt collision could destroy an audit
# record), the category-based-replace contract in `sync-from-template.md`, and
# the obsoleted∩shipped disjointness in `.coc-obsoleted`. There was no conflict,
# no warning, and no failing check. `auto-merge.yml` is notification-only and did
# not auto-merge; the merge was a deliberate admin action taken against a PR that
# looked clean because nothing was checking.
#
# The repo already SHIPPED a tool built for this class —
# `.claude/bin/sync-preflight-local-mods.mjs` — and no workflow referenced it.
#
# WHY THE GATE LIVES HERE AND NOT IN `.claude/`
#
# `.claude/**` artifacts are Class-A non-durable (`rules/artifact-flow.md`): a
# local edit to a synced file is rebuilt away by the next `/sync-to-use`, so a
# check placed there would be reverted by the very mechanism it guards against.
# The reverting sync touched ZERO files under `.github/` — verified:
#
#     $ git diff --name-only c4305de f9058ae -- .github/     # (empty)
#
# So a workflow added here SURVIVES syncs. It cannot prevent an artifact being
# overwritten. It CAN turn a silent revert into a red check that refuses the
# merge, which is the property that was missing.
#
# SCOPE, HONESTLY
#
# Gate A is a CONTENT check, not an ancestry check, because the incident was a
# content revert inside a branch that already contained the fixes. It detects a
# PR dropping substantive lines a local commit authored; it does NOT detect a
# semantic revert that preserves every line. Gate B is exact. Full per-gate
# capability and limitation statements are in the script headers.
#
# NOTE ON ENFORCEMENT: this workflow FAILS the check run. Whether a red check
# actually blocks the merge depends on branch protection (required status
# checks).
#
# The required-check context is the JOB `name:` below —
#
#     Sync invariants (local-fix discard + obsoleted disjointness)
#
# NOT the workflow filename `sync-invariants`. That filename matches no context,
# so registering it protects nothing. (HYPOTHESIS, not established: this may also
# be why the branch-protection UI picker appeared empty — the picker is populated
# from contexts reported in a recent window, so "no run had reported yet" fits
# the same observation. Do not cite it as the cause.)
#
# Verify the live registration rather than trusting this comment:
#
#     gh api repos/<owner>/<repo>/branches/main/protection \
#       --jq '.required_status_checks.checks'
#
# It must return the job `name:` string below, byte-for-byte.
#
# The gate is LOUD, not ABSOLUTE, and that is deliberate. `enforce_admins` stays
# `false`, so `gh pr merge --admin` still merges over a red. Turning it ON would
# lock the repo: protection also requires one approving review, and a solo
# maintainer cannot approve their own PR, so admin-enforcement plus the review
# requirement means nothing can ever merge.
#
# SETTLED 2026-08-07 by the repo owner: there will NOT be a second reviewer.
# This is a decision, not a pending item — do not re-open it as "revisit when a
# second reviewer is enrolled", and do not propose flipping `enforce_admins` to
# `true` as a hardening step. It would lock the repo.
#
# The standing consequence, stated plainly because it is permanent rather than
# transitional: THIS GATE CANNOT PREVENT A MERGE. It can only make one loud. Its
# entire enforcement value rests on the operator honouring a red check, which no
# mechanism in this repo can compel. A red is CLEARED — fix it, or record an
# `ACK-DISCARD:` line in the PR BODY (never a comment; the gate does not read
# comments) — and never bypassed. "I satisfied myself the finding was harmless"
# is the same reasoning that merged the sync this gate was built to catch.

# EVERY pull request, whatever its base.
#
# This deliberately carries NO `branches:` filter. It previously read
# `branches: [main]`, which silently gave a STACKED PR (one based on another
# open PR's branch rather than on main) ZERO coverage from this gate — measured:
# PR #107, based on another branch, showed one skipped check and nothing else,
# while the identical commit reopened against main (as #108) ran both gates and
# passed. Combined with `enforce_admins: false`, that let a stacked PR be
# admin-merged with the required check having NEVER RUN — a quieter form of
# merging over a red, and indistinguishable from a pass in the merge box.
#
# The gate SCRIPTS are base-branch-agnostic, so running them on a non-`main`
# base is meaningful work:
#   - Gate A takes the PR's base SHA as its first argument and compares content
#     against the MERGE BASE. Nothing in its logic references `main` (the only
#     `main` occurrences in either script are prose comments). It does depend on
#     `sync-subject-re.mjs`, which reads the shipped
#     `.claude/bin/sync-preflight-local-mods.mjs` for its subject pattern.
#   - Gate B runs against the checked-out merge result. It has no base concept.
#
# But the filter was NOT buying nothing, and an earlier revision of this comment
# claimed it was. It was also keeping non-`main` verdicts out of the REQUIRED
# CHECK NAMESPACE — which matters, because Gate A's verdict depends on the merge
# base. That property is preserved deliberately by the two-job split below;
# widening the trigger without it would have been a fail-open. Read that block
# before touching either `name:`.
on:
  pull_request:

# PR-gate only. Under the admin-merge flow the merge commit's tree equals the
# PR head's tree, so re-running on the merge-commit push is redundant
# (`rules/ci-runners.md` §13). No `push:` trigger.
permissions:
  contents: read

concurrency:
  group: sync-invariants-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# TWO JOBS, ONE GATE BODY — and why the names MUST differ.
#
# A check run is scoped to the HEAD SHA, not to the pull request. Two PRs with
# the same head commit therefore SHARE check runs. Measured: PR #107 (base
# `chore/proposal-105-fixture-runner-durability`) and PR #108 (base `main`) both
# have head `d37d08de150c`, and `gh pr checks` returns the identical job URL for
# each — #108's run surfacing on #107 purely by SHA.
#
# Branch protection resolves a required check by {app_id, context} against that
# head SHA, with NO base-branch awareness:
#
#     "checks": [{"app_id": 15368,
#                 "context": "Sync invariants (local-fix discard + obsoleted disjointness)"}]
#
# Gate A's verdict is base-DEPENDENT by construction — it compares content
# against `git merge-base "$BASE_SHA" "$HEAD_SHA"`. Put those three facts
# together and a SINGLE job running on every base is a fail-open: a PR onto
# `main` goes red, someone opens a second PR from the same commit onto a branch
# where the dropped line never existed, that run goes green under the SAME
# context name on the SAME SHA, and the later green satisfies protection on the
# first PR. That is precisely the silent-revert class this workflow exists to
# refuse, re-created one layer up.
#
# So: the job that OWNS the required context runs only on the default base, and
# a second, DIFFERENTLY-NAMED job gives stacked PRs their coverage. Renaming
# `required-gate` below silently un-protects `main` — the context string is
# registered in branch protection and matched byte-for-byte.
jobs:
  # The registered required status check. Its `name:` is load-bearing.
  required-gate:
    name: Sync invariants (local-fix discard + obsoleted disjointness)
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Gate A walks per-file commit history to distinguish locally-authored
          # commits from inbound syncs. A shallow clone silently truncates that
          # history and would produce a clean PASS by omission, so full depth is
          # load-bearing, not a convenience. The script independently refuses to
          # run on a shallow repository rather than trusting this setting.
          fetch-depth: 0
      - name: "Gates A + B"
        env:
          # The PR body is attacker-controlled text. It and the SHAs are passed
          # through the environment, never interpolated into the shell —
          # `${{ }}` inside a `run:` block would be a script-injection sink.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/run-sync-invariant-gates.sh "$BASE_SHA" "$HEAD_SHA"

  # Coverage for stacked PRs (any non-default base). Deliberately NOT the
  # registered context — see the block above. This job reports; it does not gate.
  stacked-gate:
    name: Sync invariants (non-default base)
    if: github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "Gates A + B"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/run-sync-invariant-gates.sh "$BASE_SHA" "$HEAD_SHA"
