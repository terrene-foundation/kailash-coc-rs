name: Proposal Freshness

# WHY THIS WORKFLOW EXISTS
#
# `.claude/.proposals/latest.yaml` is the Step-7b manifest loom's Gate-1
# ingests. Entries state FACTS to justify a change — "X is absent", "line N
# says Z", "11 artifacts cite it" — and Gate-1 acts on those statements.
#
# Those facts are point-in-time snapshots with no expiry. On 2026-08-09 a
# clause-level pass found 89 of 94 entries had never been re-checked since they
# were written, and among the ones that were: a count understated by more than
# half (11 claimed, 27 actual, five of them executable enforcement code), a
# request to investigate a whole tree where exactly one file was missing, and a
# "this grep returns ZERO hits" that returned seven. Each cost Gate-1 either a
# wasted investigation or an under-scoped fix.
#
# The root cause is not any individual entry. It is that evidence had no expiry
# signal. This gate is that signal.
#
# WHY IT LIVES HERE AND NOT IN `.claude/`
#
# Same reasoning `sync-invariants.yml` documents for Gates A and B: `.claude/**`
# is Class-A non-durable (`rules/artifact-flow.md`), so a check placed there is
# rebuilt away by the next `/sync-to-use`. `.github/` is repo-owned here.
#
# WHY IT IS A RATCHET AND NOT AN ABSOLUTE BAR
#
# 24 entries are still unverified as of this workflow landing. A gate that
# failed on all of them would be red on every PR from day one, and an
# enforcement instrument that cannot pass trains readers to treat red as normal
# — the exact defect issue #112 records about this repo's fixture runners. So
# it fails only when a PR makes the count WORSE than its base.
#
# ENFORCEMENT, HONESTLY
#
# This workflow FAILS its check run. Whether that BLOCKS a merge depends on
# branch protection. As of 2026-08-12 this job IS registered as a required
# status check — it is merge-preventing, not merely evidence-producing.
#
# Registration uses the job `name:` below, byte-for-byte — not the workflow
# filename, and not the job KEY (`freshness`):
#
#     Proposal manifest freshness (ratchet)
#
# ORDERING MATTERS, and getting it wrong parks every PR. Registration was only
# safe AFTER the `paths:` filter came off the trigger above: a filtered workflow
# reports on some PRs and not others, and a required context that never reports
# leaves the PR at "Expected — waiting for status" with nothing to fix. If this
# filter is ever reinstated, DE-REGISTER the check in the same change.
#
# Never trust this comment for the live state — protection is edited out of band.
# Read it:
#
#     gh api repos/<owner>/<repo>/branches/main/protection \
#       --jq '.required_status_checks.checks'
#
# To de-register, PUT the protection payload back with this context removed from
# the `checks` array; `enforce_admins` is false, so `gh pr merge --admin` is the
# escape hatch in the meantime.
#
# WHAT IT CANNOT DO
#
# It compares dates. It does not read prose, so it never claims a specific
# entry is wrong — only that its evidence predates a sync that could have
# falsified it. It cannot catch a claim falsified by something other than a
# sync. `reconciled_at` is self-reported and taken on trust. A PASS means "not
# staler than before", never "every claim holds".
#
# The duplicate-group half is weaker still, and deliberately so. It checks that
# a NEWLY duplicated (file, action) target carries a non-empty pairing key on
# at least one of its entries — `ingest_note`, or `pairing` /
# `cross_reference` / `dedup_note` / `note_for_gate_1` inside
# `reconciliation:`. It does NOT read that note, so it cannot tell a real
# pairing from the word "paired". It asserts the coupling was DECLARED, never
# that it was declared correctly; the reading stays Gate-1's.
#
# Until 2026-08-10 this half failed on the duplicate COUNT and then told the
# author to add an `ingest_note` — advice no code checked, so following it did
# not clear the red. That is the shape the header warns about two paragraphs
# up: an instrument whose instruction cannot clear it trains readers to treat
# red as normal. The fixtures gate-c-head-dup-{undocumented,documented}.yaml
# differ only in that note and are driven by the self-test below, so the check
# is shown to discriminate on the coupling rather than on the count.

# TRIGGER: deliberately UNFILTERED.
#
# This workflow carried a `paths:` filter until 2026-08-12. That made it
# unregistrable as a required check, which was measured, not assumed: PR #133
# (journal cleanup, manifest untouched) produced ZERO check runs from this
# workflow, while PR #135 (manifest touched) produced one. A required context
# that reports on only some PRs leaves the rest parked at "Expected — waiting
# for status to be reported" forever.
#
# So the filter is gone and the ratchet runs on every PR. On a PR that does not
# touch the manifest the comparison is head-vs-base over an identical file — a
# genuine 0 -> 0 pass, not a special-cased skip, which keeps the result readable
# as the same measurement in both cases.
#
# The cost is the ~1-minute GitHub Actions minimum per PR (`ci-runners.md` §10).
# Paid deliberately: it buys a check that CAN be required, and it runs the
# self-test below on every PR rather than only on the PRs that happen to touch
# this file — so the gate's ability to discriminate is re-proven continuously
# instead of at the moments it is least likely to have regressed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: proposal-freshness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Proposal manifest freshness (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The ratchet reads the base revision of the manifest via `git show`,
          # so the base commit must be present. A shallow clone would make the
          # base unreadable, which the script reports as "no baseline" — a PASS.
          # That would be a pass by omission, so the depth is load-bearing.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Pinned rather than floating: the gate parses a file whose structure
        # decides a merge signal, and a silent parser behaviour change would
        # move that signal with no diff to explain it.
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Self-test — prove the gate can fail before trusting it passes
        # A gate only ever demonstrated PASSING has not been shown to
        # discriminate (`rules/instrument-discipline.md` MUST-3). This step
        # drives the fixtures every run: a regressing pair MUST exit 1 and an
        # unchanged pair MUST exit 0. If the gate ever stops discriminating,
        # this fails here rather than silently green-lighting every PR.
        run: |
          set -euo pipefail
          F=.github/scripts/fixtures
          G=.github/scripts/check-proposal-freshness.py

          # The fixtures' reference point, PINNED — never read from the live
          # `.claude/VERSION`. This is the whole fix for the 2026-08-13 breakage:
          # the fixtures' entries are dated 08-09/08-10, an inbound sync moved
          # `upstream.synced_at` to 08-13, every fixture entry became "predates
          # sync", and the fixture that MUST pass failed — reddening a REQUIRED
          # check on every sync PR for a reason unrelated to the manifest.
          #
          # CONSTRAINT on this value: it MUST be <= the earliest `reconciled_at`
          # in the fixtures (2026-08-09), or the fixtures' entries stop counting
          # as verified and the pass/fail expectations below invert. It is a
          # constant precisely because the fixtures are constants.
          SYNC_DATE=2026-08-02

          # expect <want-rc> <fixture> <what it proves> [extra args...]
          #
          # Asserts the EXACT exit code, not merely non-zero. Exit 1 is "the
          # ratchet regressed"; exit 2 is "the gate could not run". An earlier
          # version tested `if python3 ...; then fail`, which counted BOTH as a
          # successful discrimination — so a fixture that failed to parse, or a
          # gate that refused to start, read as proof the gate still works.
          expect() {
            local want="$1" fixture="$2" why="$3"; shift 3
            local rc=0
            python3 "$G" --manifest "$fixture" \
              --base-manifest "$F/gate-c-base.yaml" "$@" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -ne "$want" ]; then
              echo "SELF-TEST FAILED: $fixture exited $rc, expected $want"
              echo "  ($why)"
              echo "The gate is not behaving as the fixture asserts, so neither its"
              echo "PASSes nor its FAILures can be read as measurements."
              exit 1
            fi
          }

          expect 1 "$F/gate-c-head-regressed.yaml" \
            "a new entry with no reconciliation block must regress the count" \
            --sync-date "$SYNC_DATE"
          expect 1 "$F/gate-c-head-dup-undocumented.yaml" \
            "a new duplicate group with no stated coupling must fail" \
            --sync-date "$SYNC_DATE"
          expect 0 "$F/gate-c-head-dup-documented.yaml" \
            "the SAME duplicate group WITH a pairing note must clear" \
            --sync-date "$SYNC_DATE"
          expect 0 "$F/gate-c-base.yaml" \
            "an unchanged manifest must pass" \
            --sync-date "$SYNC_DATE"

          # HERMETICITY FENCE. The four cases above are only meaningful if the
          # gate cannot silently resolve its reference point from live state
          # when the pin is absent — which is exactly what it used to do. Drive
          # the fixture path with NO --sync-date and require a refusal (exit 2).
          # Deleting the fence in the script reds this case, so the fence is
          # shown to exist rather than asserted to.
          expect 2 "$F/gate-c-head-dup-documented.yaml" \
            "fixture mode with no --sync-date must REFUSE, not fall back to live VERSION"

          echo "Self-test OK: fails on an unverified entry and on an undocumented"
          echo "duplicate; passes on no-change and on a documented duplicate; and"
          echo "refuses to run fixtures against live state at all."

      - name: Gate C — manifest freshness ratchet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check-proposal-freshness.py --base-ref "$BASE_SHA"
