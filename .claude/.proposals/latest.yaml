      was defeated by a FILENAME COLLISION, entirely outside the tier logic.
      THE FIX IS TWO HALVES AND BOTH ARE REQUIRED — the report proposed only one.
      (a) `flag: "wx"` — create-or-fail, so an immutable audit record can never be
      clobbered; reaching that path means the same (date, target, action, mode) was
      already authorized, so refusing costs the caller nothing and the message says
      so. (b) an 8-hex sha256 digest over the FULL UNTRUNCATED (target, action,
      mode) triple appended to the filename, discriminating exactly where the
