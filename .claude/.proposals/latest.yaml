      branches asks the consumer to edit `sync-manifest.yaml`. But: the consumer
      distributes nothing, so no tier membership is meaningful; and
      sync-manifest.yaml is itself a SYNCED artifact, so a consumer's edit is
      overwritten on the next sync (the sibling merge-vs-replace entry above).

      THE SYNCED-ARTIFACT PREMISE, CITED (it looks refuted on a first grep and
      is not). `sync-manifest.yaml` appears under a top-level `exclude:` block
