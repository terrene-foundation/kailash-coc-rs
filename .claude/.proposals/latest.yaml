    dedup_evidence: >-
      NOT already solved here. schema-migration.md at 2.23.23 carries MUST
      Rules 1-7 (numbered migrations / data-fixes-are-migrations / reversible
      path / append-only / real-schema testing / production-sync deploy gate /
      force_downgrade). NONE covers a model-field addition that never reaches
      a migration at all. Rule 1 assumes the author knows a DDL change is
      happening; this failure mode is that the author does NOT — the field
      edit looks like a model change, not a schema change.
    reason: >-
      A new DataFlow @db.model field added to a table that is ALREADY
      provisioned on a persistent store needs the FULL paired-artifact set,
      not just the model edit. create_tables() is CREATE TABLE IF NOT EXISTS —
      it emits the new column only for a FRESH table and never ALTERs an
      existing one, so the column stays absent on the live store. The new
      field also flips the model-set schema fingerprint, so a schema-head-sync
      deploy gate goes GREEN while the column is still missing (the gate
      verifies head-sync, not column presence). This is CI-INVISIBLE — a fresh
      test database gets the column from create_tables(), so every test passes
      green; the gap manifests only on the persistent production store that
      predates the field. The paired-artifact set is THREE, discovered across
      successive CI rounds: (a) a packaged ALTER TABLE ... ADD COLUMN IF NOT
      EXISTS migration registered in the packaged store-DDL manifest; (b) a
      field-classification regen so the new field carries its
      data-classification (a classification-divergence gate blocks otherwise);
      (c) a manifest-count spec/citation-test bump (the new manifest entry
      changes the pinned count). The migration ALONE is insufficient — the
      classification + manifest-count gates block independently. Fresh-DB CI
      is authoritative over a local suite that never runs the
      classification/manifest-count gates.
    diff_lines: "+18 -2"
    template_ingest_note: >-
