    reason: |
      ENROLLMENT GAP B (placeholder semantics not cascaded).

      The /whoami command body + genesis-anchor-guard reference
      ".claude/operators.roster.README.md for placeholder semantics" and
      "PLACEHOLDER-prefixed entries for fresh-genesis cases", but that README
      is ABSENT in this template (verified: file does not exist). A template
      consumer (or template-operator) has no documentation of what a
