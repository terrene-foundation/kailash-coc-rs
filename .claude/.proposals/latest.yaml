      (280), `sync-preflight-local-mods.mjs` (181) and
      `upstream-issue-hygiene.md` (41). The failure is SCOPE and INFERENCE, not
      DETECTION.
      THE ASK: replace the authorship-based safety inference with a
      CONTENT-based control-subtraction check. Provenance does not entail
      safety — loom shipping a control in sync N and removing it in sync N+1 has
      sync-only authorship at every step, which is the shape of all five #150
      regressions. Minimum fixes: cap AFTER the subject filter (or drop the cap
      and bound by `$MERGE_BASE`); widen scope beyond `.claude/`; and correct
      the preflight's fail-direction claim to name the matching-subject case the
      gate's own header already documents.
