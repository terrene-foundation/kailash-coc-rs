      schema (§ "Downstream Upflow Proposal Schema") is a flat `changes:` list
      of per-file entries with `file / action / base_version / reason /
      diff_lines`. There is NO field for (a) a constraint that spans MULTIPLE
      changes, or (b) a dependency BETWEEN changes. The proposer had nowhere
      correct to put a plan that governs one entry and is implemented by
      another, so the PR body was the only available surface — a rational
      choice given the schema.

