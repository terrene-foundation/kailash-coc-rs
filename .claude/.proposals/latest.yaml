    reason: |
      SWEEP 9's PRE-CONDITION GATE THROWS AT EVERY CONSUMER INSTEAD OF EMITTING
      ITS N/A SENTINEL — SURFACED BY RUNNING /sweep, NOT BY READING IT.

      Sweep 9's gate is designed to self-detect the orchestration root and emit
      a clean sentinel everywhere else. The command's own prose states the
      intent: the N/A sentinel keeps "the distributed command byte-identical on
      the 30+ downstream consumers (which carry no resolver config)", and
      separately that an ERROR sentinel "is itself a finding — surface it".

      Those two statements are in conflict at every consumer, because the gate
      opens with an unconditional dynamic import of
      `.claude/bin/lib/loom-links.mjs` and that module is FENCED loom_only.
      Verified: `sync-manifest.yaml:2870` reads
        `- .claude/bin/lib/loom-links.mjs # why: F1030a — fenced loom_only;
           purge the stale BUILD-lane copy.`
      so the module is not merely absent from distributed lanes — it is
      actively purged from them. Confirmed on disk here: `.claude/bin/lib/`
      contains 9 tracked files and loom-links.mjs is not among them.

      OBSERVED OUTPUT at this template (verbatim, path genericized):
        <!-- sweep-ecosystem:v1:ERROR reason=Cannot find module
             '<repo>/.claude/bin/lib/loom-links.mjs' -->

      The `.catch()` that exists to report a genuine resolver failure instead
      catches a module-not-found that is the EXPECTED state everywhere the
      command is distributed. Two consequences:
        (1) Every consumer and template running /sweep emits a spurious
            finding, which the command's own contract instructs the reader to
            surface — manufacturing recurring noise in a management decision
            report whose value depends on its findings being real.
        (2) A REAL resolver error (a corrupt loom-links, a genuine
            configuration fault at the orchestration root) becomes
            indistinguishable from the expected not-orchestration-root case,
            because both arrive as the same ERROR sentinel. The diagnostic
            value of the ERROR branch is destroyed precisely where it matters.

      FIX — KEY THE N/A ON THE RESOLVER CONFIG, NOT ON A MODULE ERROR CODE.
      The sentinel is about whether this repo IS an orchestration root, and the
      command's own prose already names the right signal: the 30+ consumers
      "carry no resolver config" (sweep.md:138-144). So: **config ABSENT → N/A
      (not-orchestration-root). Config PRESENT but the module is missing or its
      import fails → ERROR.** Pair that with an `fs.existsSync` probe on the
      module path rather than an error-code sniff.

      DO NOT key this on `ERR_MODULE_NOT_FOUND`. Two independent defects
      survive any fix that does:
        (1) TRANSITIVE MASKING — a loom-links.mjs that EXISTS but whose own
            import is missing throws the SAME code, so a code-match reports a
            genuinely broken orchestration-root install as a clean N/A. That is
            precisely the fault the ERROR branch exists for.
        (2) INDUCIBLE CLEAN — delete or rename the module at loom and Sweep 9
            reports not-orchestration-root; the entire cross-ecosystem roll-up
            silently vanishes from the management report with NO finding.
      Keying on the config is immune to both, because the config is a positive
      signal independent of the module. Con (stated): it couples the gate to a
      second path — worth it, because that path is what the sentinel is
      actually about.

      SAME PASS — THE ERROR BRANCH CURRENTLY VIOLATES THE COMMAND'S OWN
      CONTRACT. sweep.md:138 states the gate "prints logical KEYS only (NEVER a
      resolved absolute path — the loom-links caller contract)", but the
      `.catch()` at :141 emits `e.message` unfiltered, which KEYS-only does not
      cover. Node embeds the resolved specifier in an ERR_MODULE_NOT_FOUND
      message, and /sweep output demonstrably gets committed (this cycle's
      report sits at the repo root of a `visibility: public` template), so the
      branch can commit an operator-absolute path. This cycle's capture was
      hand-genericized to `<repo>/`; nothing in the code did that. FIX: emit a
      TYPED reason (`reason=resolver-failed code=<e.code>`) or scrub the message
      against the repo root before emission — do not print raw `e.message`.
    diff_lines: "~+6 -2 (gate block only)"
    review_recommendations:
      - "This is a defect in a DISTRIBUTED command surfaced by executing it, in the same detection-method class as the cross-repo-authz receipt entry above: the artifacts are internally consistent on inspection and the fault appears only when the command actually runs somewhere other than loom. Worth Gate-1 noting that /sweep's own Sweep-9 is currently the only sweep that cannot be trusted to report cleanly at a consumer."
      - "Check for siblings before fixing point-wise: any other distributed command or hook that imports a loom_only lib will fail the same way. A grep across distributed commands/hooks for imports of loom_only-fenced paths would establish whether this is one instance or a class."
      - "The fix must not simply broaden the catch to always emit N/A — that would silence a genuine orchestration-root resolver fault, trading this false-positive for a false-negative at the one repo where Sweep 9 actually does work."

