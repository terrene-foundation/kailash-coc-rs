            the verified subtree, and a no-orphan declaration check
            (`undeclared-local-rule`). It is wired at emit.mjs:73 + :683 and
            fenced at sync-manifest.yaml:3395.
            PREFERRED: point consumers at `rules/local/**` and fix the real
            gap, which is that sync-from-template.md never mentions it — a
            documentation fix, not a new namespace. IF Gate-1 nonetheless wants
            a distinct `project/` namespace, it MUST route through the SAME
            loader and carry the SAME four guards — never a second, weaker
            copy.
            `commands/project/**` MUST NOT land on this proposal's strength
            alone: there is no guard analogue for commands anywhere in the
            tree, and a command body is an instruction set the agent EXECUTES
            rather than a rule it weighs. Whether a local command can shadow a
            shipped one at invocation is a CC-namespacing question this
            proposal does not answer; the collision guard must exist before the
            namespace does.
            NOTE FOR GATE-1 (verified at this template, and it cuts both ways):
            `.claude/rules/local/` does NOT exist on disk here — the LOADER and
            the manifest fence ship, but the subtree (which sync-manifest.yaml
