      scopes it to the UNRECOGNIZED case. What is wrong is its TRAILING ABSOLUTE,
      which reads as a global fail-direction guarantee. The converse — a LOCAL
      commit whose subject MATCHES the pattern — is exactly a silent miss.
      STRONGER INSTANCE, missed by an earlier draft: `check-local-fix-discard.sh`
      contradicts ITSELF, asserting at :38-40 that it "OVER-reports — a false
      at-risk, never a silent miss" eleven lines above the :51-52 header text
      documenting exactly that silent miss. The leak class is LIVE here: of 31
      `chore(coc):` subjects most are themselves syncs and roughly 6 are
      genuinely local, of which three are unambiguous disclosure scrubs by
      subject
      ("strip BUILD-internal packages/... paths", "strip residual sibling-SDK
      repo names"). Measured negative result, recorded honestly: inbound #150
