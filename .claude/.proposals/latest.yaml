      An earlier draft of this entry said "Gate A's 84 flags" and "a 62-file
      SYNC-ONLY bucket". Both were carried forward from a 2026-08-13 sweep taken
      against a DIFFERENT `main` and were never re-derived — which is this
      entry's own defect class, committed inside the entry that names it, and it
      is recorded rather than quietly corrected. Measured now
      (`bash .github/scripts/check-local-fix-discard.sh main refs/adjudicate/sync-150`,
      exit 2): 348 files scanned, **17 flagged**, 0 acknowledged — not 84.
      Partitioning all 348 under Gate A's OWN query: 28 files carry >=1 non-sync
      commit (eligible to flag), **180 are SYNC-ONLY and skipped at :182**, and
