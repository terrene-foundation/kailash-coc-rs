            repo-generic (repoRoot-based) and works unchanged.
        (c) Preserve `.claude/team-memory/` BY DECLARATION, NOT by a
            `team-memory/**` glob. A wholesale glob would FREEZE shipped
            artifacts: sync-manifest.yaml:1310 declares `team-memory/README.md`
            and :1613 declares `team-memory/canonical-build-targets.md`, and
            BOTH exist on disk at this template. Preserving the whole subtree
            makes two tier-managed governance artifacts permanently
            un-updatable at every consumer — the artifact-flow.md Class-A
            distribution-durability invariant inverted, and the exact opposite
            of this entry's own central argument. Correct discriminator: a
            manifest-DECLARED team-memory file updates from the template; an
            UNDECLARED one (a locally-promoted signed fact) is preserved. This
