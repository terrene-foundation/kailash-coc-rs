      `exclude: sync-manifest.yaml` rule" that ships the loom manifest to
      multi-CLI USE templates, which then reaches consumers via
      sync-from-template's own template-version-wins rule. Independent
      corroboration: `emit.mjs::safeReadFileSync` (line 55) opens with a bare
