        `.claude/learning/posture.json`, `.claude/operator-id` — all matched).
        The entry's central EVIDENCE claim ("BUT .claude/operators.roster.json
        is NOT gitignored — `git check-ignore` returns no match") is therefore
        NO LONGER TRUE as of the 2026-07-22 sync and MUST NOT be re-read as
        current state at Gate-1.
      still_open: >-
        The DISCLOSURE-mechanism half only. This entry's FIX offered loom a
        choice of mechanisms (gitignore vs a committed placeholder roster);
        gitignore was chosen and shipped. The surrounding GAP-A policy
        questions are NOT closed by that: sibling entries 5
        (.claude/operators.roster.README.md) and 6
        (guides/co-setup/11-genesis-ceremony.md) remain ABSENT from this
        template — verified by file-existence check this session — and the
        broader ecosystem-scope escalation in this entry's
        review_recommendations is untouched. Note entry 6 targets
        `guides/co-setup/**`, which is `use_excluded`, so its absence HERE is
        expected and proves nothing about loom; only entries 5 and 7 are
        genuinely verifiable from this template as still-open.
      disposition: >-
        Gate-1 should treat the gitignore mechanism as DONE and re-scope this
        entry to its policy half, rather than re-classifying the whole thing.
        Same-class sibling: the OTHER `.gitignore` entry in this manifest (the
        `.session-notes.migrated` one, titled "SHIPPED-HOOK / SHIPPED-GITIGNORE
        MISMATCH") is the SECOND instance of this exact failure shape — a
        COC-relevant file the ignore policy does not cover, in a public
        template. Referenced by title rather than index because entry ordinals
        shift as the manifest is appended to. Worth one sweep, not two point
        fixes.
    reason: |
      ENROLLMENT GAP A (roster contamination vector) — surfaced when /whoami
      --enroll-genesis was invoked at this USE template.

      EVIDENCE (git check-ignore, this template): .claude/learning/ is
      gitignored (.gitignore:74) so coordination-log.jsonl + posture.json +
      .initialized are LOCAL-ONLY (never committed); .claude/operator-id is
      gitignored. BUT .claude/operators.roster.json is NOT gitignored
      (`git check-ignore` returns no match). A USE template is cloned publicly
      / used-as-template by consumers. If an operator runs enrollment here, the
      created roster IS committable and ships to every consumer clone, carrying
      the template-operator's identity (display_id, github_login, GPG/SSH
      PUBLIC KEY) declared role: owner, plus a genesis block pinning the
      template's repo_owner + the template's OWN root_commit. Two failures: (1)
      operator-identity DISCLOSURE to every public consumer; (2) a FOREIGN
      trust-root that fold rule 9a (first-wins, immutable) forces on the
      consumer — blocking the consumer's own genesis enrollment as a trust-root
      fork (the genesis residual). The genesis-anchor RECORD is safe (it lives
      in the gitignored log); the ROSTER is the leak.

      FIX (loom Gate-1 decides the mechanism — both are defensible):
      (a) gitignore .claude/operators.roster.json in the USE-template tier so a
          template-operator's enrollment stays local-only exactly as the log
          does — consumers create their own roster fresh on first enrollment; OR
      (b) ship a PLACEHOLDER roster (PLACEHOLDER-prefixed entries per the
          schema/guard's documented placeholder semantics) that is safe to
          commit and that the consumer overwrites at enrollment.
      The inconsistency (roster trackable while sibling state is gitignored) is
      the root defect; pick one model and apply it tier-wide to ALL kailash-coc-*
      templates. NOTE: in a BUILD/loom repo the roster IS a committed shared
      substrate (correct there); the fix is USE-template-tier-specific, not
      global to every repo class.

