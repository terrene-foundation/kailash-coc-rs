  - file: .claude/bin/emit-cli-artifacts.mjs
    action: modify
    origin: use-template
    suggested_tier: coc
    reason: >-
      NINE SKILL-CHANNEL RULES ARE ABSENT FROM THE DELIVERED RULES-REFERENCE
      INDEX, AND FOUR OF THEM CANNOT BE EXPLAINED BY THE KNOWN FRONTMATTER
      DEFECT. This is the same failure mode as the already-filed
      no-frontmatter issue — a path-scoped rule reaching NEITHER the baseline nor
      the skill channel on Codex and Gemini — at a file set nobody has
      enumerated.
      MEASURED. Validator 18 assigns 79 rules to the `skill-channel` lane; the
      delivered `.codex/skills/rules-reference/SKILL.md` carries 70. The nine
      absent: `build-cache-hygiene.md`, `build-speed.md`, `burn-down-reporting.md`,
      `canon-incorporation.md`, `dataflow-null-typing.md`,
      `llm-auth-strategy-hygiene.md`, `llm-deployment-coverage.md`, `release.md`,
      `version-cadence.md`.
      WHY THE OBVIOUS EXPLANATION IS REFUTED. Four of them —
      `build-cache-hygiene`, `canon-incorporation`, `llm-deployment-coverage`,
      `version-cadence` — carried COMPLETE and CORRECT `priority: 10` /
      `scope: path-scoped` frontmatter at the last emission commit, identical in
      shape to a sibling rule that IS in the index. Missing frontmatter therefore
      does not explain them. The cause is INDETERMINATE from inside this template
      (determining it means reading loom's global rule set, out of scope under
      repo-scope-discipline.md), but the ABSENCE is measured and is not in
      dispute.
      WHY IT IS NOT THE ALREADY-FIXED DEFECT. The frontmatter root cause is
      resolved at HEAD: `[validator-14] rule-frontmatter: PASS`, and
      `validateCliDelivery()` returns pass with the previously-dropped rule
      correctly assigned to `skill-channel`. The `if (!fm) continue` silent drop
      no longer occurs. This is a SURVIVING, DISTINCT gap between the lane
      assignment and the delivered index.
      A CORRECTION WORTH CARRYING, since the related issue overstates the harm:
      Codex and Gemini consumers do NOT "receive no guidance whatsoever" on the
      pattern rules — the delivered rules-reference index carries that row, and
      carried it before the frontmatter fix. The baseline files never inline
      path-scoped rules at all (a baseline control string returns 1 there while
      three path-scoped rules return 0), so absence from the baseline is correct
      lane behaviour, not a drop. The real defect is narrower and is the nine
      files above.
      THE MECHANISM, LOCATED. `emit.mjs:3102-3105` asserts in a COMMENT that
      "the skill-channel rules are now DELIVERED by
      emit-cli-artifacts.mjs::emitRulesReferenceSkill, which resolves the SAME
      lane set through the shared cli-delivery parser — the count below provably
      equals the rule count in the emitted rules-reference index." That claim is
      FALSE BY CONSTRUCTION. `emitRulesReferenceSkill`
      (emit-cli-artifacts.mjs:625) receives `skippedContractFail` and
      `skippedNoFrontmatter` from `buildRulesReferenceIndex`, and on a non-zero
      skip it writes an ADVISORY to stderr (":640-646") and CONTINUES — it does
      not fail, and it does not reconcile. So the emitted index is the lane set
      MINUS the skips, while validator 18 reports the lane set. The two counts
      can differ by construction, and the measured 79-vs-70 is that difference.
      THE CLASS. This is a value owned by one authority (the emitter's actual
      output) restated as a guarantee at another surface (a comment in the
      validator), with nothing failing mechanically when the two diverge — the
      same derived-not-restated class as the parity-lock entry filed alongside
      this one. The comment is load-bearing precisely because it is what a
      maintainer reads instead of measuring.
      THE ASK: reconcile the skill-channel lane assignment against the emitted
      rules-reference index MECHANICALLY, so a rule assigned to the lane but
      absent from the delivered index fails emission rather than shipping behind
      a stderr advisory. If loom's design intends skips to be tolerated, then the
      "provably equals" comment MUST be deleted in the same change — an untested
      guarantee in a comment is worse than a stated absence.
    dedup_evidence: >-
      Three of the nine — `canon-incorporation.md`, `llm-deployment-coverage.md`,
      `version-cadence.md` — return 0 hits across all 129 entries, against a
      control of 9 hits for `build-cache-hygiene.md` on the same file, so the
      matcher fires and the zeros are true negatives. The five `rules-reference`
      hits in the manifest were read rather than counted: they concern the skill's
      DESCRIPTION text and its PASS reporting, plus the no-frontmatter case. NONE
      asserts index MEMBERSHIP. The frontmatter-half entries were also read and
      cover the lane assignment, not the delivered index.
    reconciliation:
      status: STILL-OPEN — net-new, filed 2026-08-14; surviving instance after the frontmatter root cause was fixed
      reconciled_at: 2026-08-14
      evidence: >-
        Lane membership taken from a direct `validateCliDelivery()` invocation at
        HEAD; index membership read from the delivered
        `.codex/skills/rules-reference/SKILL.md`; frontmatter state of the four
        unexplained files read from the last emission commit via `git cat-file`,
        not from the working tree. The file key is the EMITTER, not a
        `.claude/skills/rules-reference/SKILL.md` source file — that path does not
        exist (`ls` returns absent for it while returning a real file for a
        control), because the index is GENERATED into `.codex/` and `.gemini/`
        only. RESIDUAL, stated rather than assumed: WHICH skip bucket
        (`skippedContractFail` vs `skippedNoFrontmatter`) each of the nine falls
        into was NOT measured, because emission halts at validator 16 before the
        emitter runs — so the stderr advisory that would name them is
        unobtainable at this template until #125 is resolved. The COUNT
        discrepancy and the skip MECHANISM are both measured; the per-file
        attribution is not.

