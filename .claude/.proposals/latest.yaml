  - file: .gitignore
    action: modify
    suggested_tier: coc
    reconciliation:
      status: PARTIALLY-SOLVED — gitignore half landed; policy half still open
      reconciled_at: 2026-07-26
      evidence: >-
        The load-bearing gitignore mechanism this entry asked for HAS landed.
        Verified live: `git check-ignore -v .claude/operators.roster.json` →
        matches `.gitignore:133`, INSIDE the loom-managed
        coc:gitignore_additions block, so the roster is no longer committable
