      trust-root that fold rule 9a (first-wins, immutable) forces on the
      consumer — blocking the consumer's own genesis enrollment as a trust-root
      fork (the genesis residual). The genesis-anchor RECORD is safe (it lives
      in the gitignored log); the ROSTER is the leak.

