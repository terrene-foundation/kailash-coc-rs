  - file: .claude/commands/whoami.md
    action: modify
    suggested_tier: coc
    reason: |
      ENROLLMENT GAP D (command silent on the template-vs-consumer model).

      Neither --enroll-genesis nor --register addresses what enrollment MEANS at
      a USE template that will be cloned. There is no guidance ("this is a USE
      template — genesis enrollment is a CONSUMER-clone action; do NOT commit a
      populated roster into the template; the template ships placeholder/no
      roster") and no guard preventing a contaminating enrollment (GAP A). The
      command's "fresh repo: edit the bootstrap roster OR --register + promote"
      instruction assumes a normal repo, not a public template, and silently
      leads toward the contamination in GAP A.
      FIX: add a repo-class check to the --enroll-genesis / --register flow —
      when .claude/VERSION::type == coc-use-template AND the repo is a published
      template (cloned by others), the command MUST surface the consumer-vs-
      template distinction and refuse / loudly warn before writing a committable
      roster with real operator identity. Mirrors the issue-triage-routing
      repo-class dispatch in change #1 — both are "the command must branch on
      .claude/VERSION::type" gaps.

    review_recommendations:
      - "These four entries (GAPs A-D) are ONE coherent finding: the genesis/enrollment ceremony was cascaded to USE templates as CODE without the CONTEXT (roster gitignore model), DOCUMENTATION (roster README + runbook), or GUARDS (command repo-class check) a publicly-cloned template needs. Classify together."
      - "GAP A is the load-bearing/highest-severity one (active disclosure + foreign-trust-root contamination on every consumer clone). Recommend loom treat it as the priority fix and decide the gitignore-vs-placeholder model tier-wide."
      - "Surfaced live: /whoami --enroll-genesis was invoked at kailash-coc-rs; all cryptographic eligibility checks PASSED (org-admin attestation, root-commit verified) but enrollment was correctly NOT performed because of GAP A. No roster, log, or anchor was written. No operator key fingerprint is quoted in this proposal (disclosure-scrubbed); the contamination is described structurally."
      - "Cross-tier: GAPs A-D apply to EVERY kailash-coc-* USE template (claude-py, claude-rs, claude-rb, py, rs), not just rs — loom should fix tier-wide in one Gate-1 pass."
      - "ECOSYSTEM-SCOPE ESCALATION (co-owner-flagged): GAP A is the USE-template-tier SLICE of an ecosystem-wide contamination class. The deploy-to-client workflow clones the ENTIRE ecosystem (loom + kailash-rs + kailash-py + ALL use templates); any committed operator-/trust-identifying state in ANY repo class transfers into the client fork, breaking the bidirectional ecosystem-fork disclosure isolation (artifact-flow.md § Ecosystem Forks vs Downstream Consumers). Surface to audit AT LOOM across ALL repo classes (not inferrable from a single template session): (1) operators.roster.json tracked-vs-ignored per repo class; (2) committed journal/NNNN-<display_id>-*.md frontmatter identity; (3) team-memory promoted_by identity; (4) per-repo .gitignore coverage of coordination-log/posture/operator-id/.initialized; (5) the ABSENT canon->client clone-scrub (the cross-ecosystem-disclosure-guard.js fences publish + fork->canon write, NOT the clone-to-instantiate-a-fork path — activation deferred #576). RECOMMENDED DISPOSITION: this exceeds a single proposal — open a dedicated loom workstream (/analyze -> architecture -> /todos -> /implement) delivering (A) a unified validator-enforced state-locality policy across every repo class, (B) a deploy-to-client fork-instantiation ceremony that resets rosters->placeholder + clears logs + re-anchors genesis to the client owner + applies a journal/identity policy, (C) GAPs B-D enrollment template-awareness, (D) clone-direction disclosure-guard activation, (E) a fresh-fork-carries-zero-canon-identity verification. These 7 proposal entries are the template-tier inputs to that workstream, not the whole fix."

