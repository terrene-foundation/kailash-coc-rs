            originating filing measured one consumer: 15 of 18 differing rules
            carried local commits, several with double-digit edit counts. A
            sync discards all of them with no conflict, no warning, and no
            record. (Per-rule edit histogram deliberately omitted — the total
            carries the blast-radius argument, and a per-artifact breakdown is
            a narrower selector over a stated population of 30+ consumers than
            the argument needs. Recoverable from the originating filing, which
            does not travel.)
        (2) A consumer that authors a NEW local rule is preserved only by
            accident, via the "exists ONLY in this repo" clause. The moment the
            template ships a file of the same name, the local rule is silently
            overwritten.

      This is not incidental drift. Those local edits are the consumer's own
      codified institutional knowledge — produced by the /codify cycle this
      very framework prescribes. The framework tells consumers to codify, then
      provides no durable home for two of the four artifact types it asks them
      to codify into.

      SECOND INSTANCE OF THE SAME GAP. `.claude/team-memory/**` is absent from
      the preserved list (verified: `grep -n "team-memory"
      .claude/commands/sync-from-template.md` returns no match), so a sync
      overwrites it. Per knowledge-convergence.md these are per-repo SIGNED
      facts carrying promoted_by / signed / body_anchor frontmatter — per-repo
      state in the same class as learning/**, which IS preserved. Signed
      per-repo state being replaced by another repo's copy is a correctness
      problem, not only a data-loss one.

      FIX (loom Gate-1 decides the mechanism; the contract must end up
      self-consistent either way):
