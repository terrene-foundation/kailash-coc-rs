  - file: .claude/commands/sync-from-template.md
    action: modify
    suggested_tier: coc
    reason: |
      THE HEADLINE CONTRACT AND THE OPERATIVE RULE CONTRADICT EACH OTHER, AND
      THE RULE IS THE ONE THAT RUNS.

      § "Merge Semantics" (line 27) states: "This is a **merge**, not an
      overwrite." Eight lines later (line 35) the operative Rule states: "If a
      file exists in BOTH the template and this repo, the template version wins
      (it's the upstream source)." Template-version-wins IS an overwrite. There is no per-file
      merge, no three-way merge, and no conflict surface anywhere in the
      command. Preservation is by PATH CATEGORY only:
        agents/project/** · skills/project/** · learning/** · .proposals/** ·
        settings.local.json · workspaces/** · root CLAUDE.md

      WHY THIS DESTROYS CONSUMER WORK. The same command instructs downstream
      consumers to codify locally ("/codify writes to .claude/agents/project/
      and .claude/skills/project/ and stays LOCAL"). But there is no
      `rules/project/` and no `commands/project/` — verified mechanically at
      this template: `grep -cE 'rules/project|commands/project'
      .claude/commands/sync-from-template.md` returns 0. So a consumer has a
      sanctioned local home for agents and skills, and NONE for rules or
      commands. Two consequences follow:
        (1) A consumer that edits a shared rule loses the edit silently. The
            originating filing measured one consumer: 15 of 18 differing rules
            carried local commits, several with double-digit edit counts. A
            sync discards all of them with no conflict, no warning, and no
            record. (Per-rule edit histogram deliberately omitted — the total
            carries the blast-radius argument, and a per-artifact breakdown is
            a narrower selector over a stated population of 30+ consumers than
            the argument needs. Recoverable from the originating filing, which
            does not travel.)
        (2) A consumer that authors a NEW local rule is preserved only by
            accident, via the "exists ONLY in this repo" clause. The moment the
            template ships a file of the same name, the local rule is silently
            overwritten.

      This is not incidental drift. Those local edits are the consumer's own
      codified institutional knowledge — produced by the /codify cycle this
      very framework prescribes. The framework tells consumers to codify, then
      provides no durable home for two of the four artifact types it asks them
      to codify into.

      SECOND INSTANCE OF THE SAME GAP. `.claude/team-memory/**` is absent from
      the preserved list (verified: `grep -n "team-memory"
      .claude/commands/sync-from-template.md` returns no match), so a sync
      overwrites it. Per knowledge-convergence.md these are per-repo SIGNED
      facts carrying promoted_by / signed / body_anchor frontmatter — per-repo
      state in the same class as learning/**, which IS preserved. Signed
      per-repo state being replaced by another repo's copy is a correctness
      problem, not only a data-loss one.

      FIX (loom Gate-1 decides the mechanism; the contract must end up
      self-consistent either way):
        (a) EITHER make the headline true — a real merge with a conflict
            surface for locally-modified shared artifacts; OR state plainly
            that shared artifacts are REPLACED and drop the "merge" framing.
            The current text promises the first and performs the second, which
            is worse than either alone because consumers plan around the
            promise.
        (b) Give consumers a durable home for the artifact types they are told
            to codify into — but do NOT mint a bare `rules/project/**`. A
            sync-immune rule namespace with no ADD-ONLY guard is a permanent
            override surface: a consumer rule that shadows or softens a shipped
            governance rule would survive every future /sync-from-template and
            nothing upstream could correct it. A GUARDED namespace already has
            machinery — `.claude/rules/local/**`, loaded by
            `.claude/bin/lib/local-rules.mjs`, whose header states the
            invariant verbatim ("A local rule ADDS to the corpus. It MUST NOT
            OVERRIDE, shadow, or soften a canon rule") and enforces it with
            four guards: case-folded canon-id collision (`add-only-violation`),
            subtree containment with a `..` guard (`path-escape`), an
            `O_NOFOLLOW` leaf read so a planted symlink cannot redirect out of
            the verified subtree, and a no-orphan declaration check
            (`undeclared-local-rule`). It is wired at emit.mjs:73 + :683 and
            fenced at sync-manifest.yaml:3395.
            PREFERRED: point consumers at `rules/local/**` and fix the real
            gap, which is that sync-from-template.md never mentions it — a
            documentation fix, not a new namespace. IF Gate-1 nonetheless wants
            a distinct `project/` namespace, it MUST route through the SAME
            loader and carry the SAME four guards — never a second, weaker
            copy.
            `commands/project/**` MUST NOT land on this proposal's strength
            alone: there is no guard analogue for commands anywhere in the
            tree, and a command body is an instruction set the agent EXECUTES
            rather than a rule it weighs. Whether a local command can shadow a
            shipped one at invocation is a CC-namespacing question this
            proposal does not answer; the collision guard must exist before the
            namespace does.
            NOTE FOR GATE-1 (verified at this template, and it cuts both ways):
            `.claude/rules/local/` does NOT exist on disk here — the LOADER and
            the manifest fence ship, but the subtree (which sync-manifest.yaml
            :3395 says canon carries as `_README.md` + `.example.yaml`) did
            not land. So the guarded namespace is real machinery but is
            currently invisible to a consumer looking for somewhere to put a
            local rule, which plausibly explains why this proposal reached for
            a new one. Whether that non-materialization is itself a
            distribution gap is a Gate-1 question. Its scoping is also worth
            checking: the fence frames `rules/local/**` for "a fork/deployment"
            rather than a `coc-project` consumer, though the loader itself is
            repo-generic (repoRoot-based) and works unchanged.
        (c) Preserve `.claude/team-memory/` BY DECLARATION, NOT by a
            `team-memory/**` glob. A wholesale glob would FREEZE shipped
            artifacts: sync-manifest.yaml:1310 declares `team-memory/README.md`
            and :1613 declares `team-memory/canonical-build-targets.md`, and
            BOTH exist on disk at this template. Preserving the whole subtree
            makes two tier-managed governance artifacts permanently
            un-updatable at every consumer — the artifact-flow.md Class-A
            distribution-durability invariant inverted, and the exact opposite
            of this entry's own central argument. Correct discriminator: a
            manifest-DECLARED team-memory file updates from the template; an
            UNDECLARED one (a locally-promoted signed fact) is preserved. This
            is the same declared-vs-local split `local-rules.mjs` already uses,
            and it folds into review_recommendation 3's positive-allowlist
            proposal rather than competing with it.
    review_recommendations:
      - "The (a) fork is a genuine design decision for Gate-1, not a wording fix: a real three-way merge is materially more machinery than a doc correction. If loom chooses the honest-replace framing instead, (b) becomes load-bearing rather than optional — without a local namespace, honest-replace means consumers simply cannot codify rules or commands at all, which contradicts the /codify contract shipped to them."
      - "Pairs directly with the Validator-15 entry below: both are instances of 'a loom-side assumption applied unchanged at a repo that distributes to nobody.' Worth Gate-1 considering whether a single consumer-role-awareness pass across the sync-family commands closes both plus the class, rather than two point fixes."
      - "Recommend the preserved-path list be re-derived as a POSITIVE ALLOWLIST over artifact types (per cc-artifacts.md Rule 10) rather than extended entry-by-entry — team-memory/** is the second path found missing from it, which is the signal that enumeration is drifting behind the artifact surface."

