        backstop will not catch the omission. Worth considering whether V15's
        type coverage should extend to `.claude/*.md` data files, which would
        close the class rather than this one instance.
      disposition: >-
        Gate-1 action is likely one line in sync-manifest.yaml (declare the
        tier) rather than authoring a new document — check whether the file
        already exists at loom before writing one. If it does exist there, this
        is a pure registration fix and the "create" action above is
