      reconciled_at: 2026-08-11
      evidence: >-
        THE ENDORSEMENT IS PRESENT AT HEAD, verbatim, and the quote in the offer
        is exact: `.claude/rules/git.md:60` reads "Prefer `git reset --keep
        <ref>` (aborts on a dirty tree) and `git stash -u` over `git clean -f`."
        So the rule actively recommends `git stash` as the SAFE alternative in
        the very section whose subject is not destroying uncommitted work.
        THE HAZARD IS REAL AND WAS REPRODUCED HERE, in a disposable sandbox,
        rather than taken from the offer's transcript. Two worktrees on one
        `.git`: worktree A ran `git stash push -m "A's WIP"`; worktree B then
        saw `stash@{0}: On wt-a: A's WIP` in its own `git stash list`, and a
        BARE `git stash pop` in B applied A's change into B and printed
        `Dropped refs/stash@{0} (0215827...)`. A was left holding the
        pre-stash content with an EMPTY stash list and no error anywhere. The
        failure is silent on both sides: B never learns it took someone else's
        work, A never learns its work left.
        WHY THE MECHANISM GENERALIZES: stash isolation is a property of the
        `.git` DIRECTORY (`refs/stash`), not of the worktree, so this reaches
        the MAIN checkout too — any repo with >=1 `git worktree add` has the
        exposure, not just the added worktrees.
      still_open: >-
        Entire entry. The correction is small (~+4 -1) but MUST NOT land alone:
        replacing the stash endorsement with nothing would leave the section
        recommending only `git reset --keep`, with no safe route for the
        save-work-then-clean case the endorsement exists to serve. It is
        paired with the `worktree-isolation.md` Rule-9 entry relayed alongside
        it, which supplies the diff/checkout/apply replacement the corrected
        text should point at.
      note_for_gate_1: >-
        This is a CORRECTION to shipped guidance, not a gap — the rule
        currently tells every consumer to do the unsafe thing, and the
        `validate-bash-command.js` tripwire named in the same paragraph does
        NOT cover `git stash` (it fences `reset --hard` / `clean -f` / `rm
        -rf`). So the sentence is the only thing standing between a consumer
        and the failure, and it points the wrong way.
    ingest_note: >-
      PAIR THIS WITH THE OTHER `.claude/rules/git.md` ENTRY — the one about the
      depth extract `guides/rule-extracts/git.md` not shipping. BOTH target
      this file and Gate-1 should read them in one pass, but they are DISTINCT
      and neither supersedes the other: that entry is about a dangling DEPTH
      POINTER (the extract is obsoleted and never arrives), while this one is
      about a WRONG RECOMMENDATION in the rule body itself. They do not touch
      the same lines. Dedup was re-run rather than inherited: a scan for
      `stash` across all 99 prior entries returned ZERO, against controls
      firing on `rules/` (40 entries) and `.claude/` (97) — so the corpus had
      no prior claim on this hazard and the empty result is a true negative,
      not a broken matcher.
    reason: >-
      `rules/git.md` § "Destructive Working-Tree Ops" recommends `git stash -u`
