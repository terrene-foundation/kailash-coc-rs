        rather than a module error, and (b) emit a TYPED reason (`reason=resolver-failed code=<e.code>`)
        or scrub against the repo root instead of raw e.message.
      note: >-
        Two coordinates in the entry's own prose have drifted and should be re-read, not trusted:
        it cites `sync-manifest.yaml:2870` for the purge line (now :3141 BUILD / :4013 USE) and states
