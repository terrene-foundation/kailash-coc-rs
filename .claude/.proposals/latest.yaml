      catches a module-not-found that is the EXPECTED state everywhere the
      command is distributed. Two consequences:
        (1) Every consumer and template running /sweep emits a spurious
            finding, which the command's own contract instructs the reader to
            surface — manufacturing recurring noise in a management decision
            report whose value depends on its findings being real.
        (2) A REAL resolver error (a corrupt loom-links, a genuine
            configuration fault at the orchestration root) becomes
            indistinguishable from the expected not-orchestration-root case,
            because both arrive as the same ERROR sentinel. The diagnostic
            value of the ERROR branch is destroyed precisely where it matters.

      FIX — KEY THE N/A ON THE RESOLVER CONFIG, NOT ON A MODULE ERROR CODE.
      The sentinel is about whether this repo IS an orchestration root, and the
      command's own prose already names the right signal: the 30+ consumers
      "carry no resolver config" (sweep.md:138-144). So: **config ABSENT → N/A
      (not-orchestration-root). Config PRESENT but the module is missing or its
      import fails → ERROR.** Pair that with an `fs.existsSync` probe on the
      module path rather than an error-code sniff.

      DO NOT key this on `ERR_MODULE_NOT_FOUND`. Two independent defects
      survive any fix that does:
        (1) TRANSITIVE MASKING — a loom-links.mjs that EXISTS but whose own
            import is missing throws the SAME code, so a code-match reports a
            genuinely broken orchestration-root install as a clean N/A. That is
            precisely the fault the ERROR branch exists for.
        (2) INDUCIBLE CLEAN — delete or rename the module at loom and Sweep 9
            reports not-orchestration-root; the entire cross-ecosystem roll-up
            silently vanishes from the management report with NO finding.
      Keying on the config is immune to both, because the config is a positive
      signal independent of the module. Con (stated): it couples the gate to a
      second path — worth it, because that path is what the sentinel is
      actually about.

