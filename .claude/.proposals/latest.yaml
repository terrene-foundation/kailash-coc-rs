      body. The workflow documents this; it is repeated in the entry because the
      failure presents as "my acknowledgement did not work" rather than as
      "the gate read a stale body".
      WHAT GATE A ACTUALLY GOT RIGHT, stated so this entry is not misread as
      "the gate missed the regressions": its 17 flags INDEPENDENTLY include every
