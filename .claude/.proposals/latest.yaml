            to codify into — but do NOT mint a bare `rules/project/**`. A
            sync-immune rule namespace with no ADD-ONLY guard is a permanent
            override surface: a consumer rule that shadows or softens a shipped
            governance rule would survive every future /sync-from-template and
            nothing upstream could correct it. A GUARDED namespace already has
            machinery — `.claude/rules/local/**`, loaded by
            `.claude/bin/lib/local-rules.mjs`, whose header states the
            invariant verbatim ("A local rule ADDS to the corpus. It MUST NOT
            OVERRIDE, shadow, or soften a canon rule") and enforces it with
