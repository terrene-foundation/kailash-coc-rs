        directory and are cited by the same hooks, but only one was declared.
        This is precisely the "on disk at loom but unregistered ⇒ never
        cascades" failure knowledge-cascade-routing.md MUST-2 describes.
      why_the_backstop_missed_it: >-
        `emit.mjs::validateTierCompleteness` (Validator 15) is the structural
        backstop for unregistered artifacts, but it covers rules, agents, skill
