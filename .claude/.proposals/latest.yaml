      50 most recent commits OF ANY KIND, not 50 local commits. The name and its
      comment both assert otherwise, and the comment's justification ("shared
      artifacts do not accumulate hundreds of local commits between syncs") would
      hold only under the name's reading. In a repo where sync commits dominate
      per-file history, syncs crowd local commits out of the window and the file
      yields `had_local=0` -> never flagged, never examined.
      DEFECT 3 — scope. `git diff --name-only "$MERGE_BASE" "$HEAD_REF" --
      '.claude/'` (:135). On inbound #150 that is 348 of 600 changed files;
      252 files received ZERO discard checking. Full enumeration (the derived trees
      alone are 245, so an earlier draft's list was incomplete): `.coc/` 91,
      `.gemini/` 78, `.codex/` 76, `.codex-mcp-guard/` 4 (SHIPPED TOOLING, not a
