      root_cause: >-
        This is a knowledge-cascade-routing.md MUST-2 instance, and naming it
        as such is the actionable part. `operators.roster.README.md` is absent
        from `.claude/sync-manifest.yaml` ENTIRELY — verified by grep: it is
