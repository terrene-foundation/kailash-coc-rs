      WHY THAT IS A SECURITY DEFECT AND NOT AN ERGONOMICS ONE: a receipt is the SOLE
      distinguisher between an authorized cross-repo action and an unauthorized one
      (`repo-scope-discipline.md` § User-Authorized Exception condition 4 — "present
