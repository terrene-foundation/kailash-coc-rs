changes:
  - file: .claude/rules/instrument-discipline.md
    action: modified
    base_version: "2.24.0"
    reason: >-
      Proposes a MUST-4: a gate or checker's self-test MUST pin THREE outcomes
      — yes, no, and CANNOT-MEASURE — and where the instrument depends on an
      external oracle it MUST affirmatively prove that oracle's capability
      before scoring anything. Two directions (a real violation fires, a clean
      subject passes) is the customary bar and it cannot reach the failure a
      gate is most likely to ship: answering confidently from a reading it
      never actually made. MUST-1 already requires naming the falsifying
      result, but a check can name one and still be unable to tell "the
      property does not hold" from "I could not look" at runtime; this closes
      that gap on the SELF-TEST side, where it is mechanically enforceable.
      Two measured incidents, both in gates that had passing two-direction
      self-tests, and they fail in OPPOSITE polarities, which is why one
      example is insufficient. (a) FALSE ACCUSATION — a gate resolved issue
      ids through an API whose prose error for "you may not read issues" is
      identical to its prose error for "this issue does not exist". It read a
      permission-denied response as a determinate absence and reported correct,
      properly-tracked code as an untracked deferral. A gate that accuses
      correct code is worse than no gate, because operators learn to override
      it. The fix was to query through a transport whose HTTP status
      distinguishes 403 from 404, AND to prove read capability first, since
      some APIs deliberately return 404 rather than 403 for unauthorized
      resources precisely so that a 404 cannot be used to probe existence.
      (b) SILENT PASS — a gate that asks a tracker for issues carrying a label
      gets an EMPTY LIST when the token may not read issues, which reads as
      "nothing is labelled" and exits clean. That is a green verdict in exactly
      the case the gate exists to catch, and it is invisible in a green run.
      Neither is reachable by a self-test that pins only yes and no; both are
      one extra case away from being caught before merge.
    diff_lines: "+38 -0"
