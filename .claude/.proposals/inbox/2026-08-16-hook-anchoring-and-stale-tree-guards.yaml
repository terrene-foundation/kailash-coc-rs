changes:
  - file: .claude/hooks/validate-bash-command.js
    action: modified
    reason: >-
      READ THIS FIRST, because half of it is already done here and the offer is
      scoped to the half that is not. This template has ALREADY anchored the two
      `rm` patterns, with a correct explanatory comment noting that `/` is a
      non-word char so the anchor still fires for a path-qualified form. That work
      is not being re-proposed. Measured against the current template copy, TWO
      gaps remain. FIRST, five of the seven command-word patterns are still
      UNANCHORED here (mkfs, dd, chmod, curl, wget), against seven of seven
      anchored downstream. Unanchored, a pattern matches its command word EMBEDDED
      IN AN ORDINARY WORD, so a block fires on text containing no command at all.
      The concrete live one is dd. The pattern for a block-device write matches the
      substring inside `add if=...`, which is ordinary shell and ordinary prose.
      The originating downstream incident was the same shape on a pattern this
      template has since fixed. A read-only analysis heredoc containing the word
      "perform" was BLOCKED under "rm on root filesystem", because the root-delete
      clause matched inside `perfo[rm /]`. Neither that command nor the probe of it
      contained a delete. Anchoring the remaining five is a two-character change
      each and costs nothing. Measured downstream. ZERO detections lost. Root
      deletes with and without flags, under sudo, after a separator, the long-flag
      forms, mkfs, a block-device write, a recursive chmod on root, and a pipe from
      curl or wget into a shell all still block. Four false positives removed.
      SECOND, and this one is a real miss rather than an annoyance. The root-delete
      terminator here still admits only end-of-string, whitespace, or a star. It
      REJECTS A FOLLOWING QUOTE, so the two shapes that wrap a root delete in
      `sh -c` or `bash -c` with a quoted argument PASS SILENTLY through a
      block-severity gate today. Adding a quote branch to that terminator catches
