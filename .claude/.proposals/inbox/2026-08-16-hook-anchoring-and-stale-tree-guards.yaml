      deliberately ORDERED so that trade turns the coverage cases red first. A
      consumer who fixes the irritation without the fixture re-opens the miss.
      Consumer configuration required. NONE. Drop-in. Both fixes were
      mutation-tested independently downstream. Removing the anchor turned four
      fixtures red, removing the terminator turned three red, restoring gave 36
