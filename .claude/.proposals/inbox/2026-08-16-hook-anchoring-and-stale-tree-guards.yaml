  - file: .claude/hooks/stale-tree-guard.js
    action: added
    reason: >-
      PreToolUse on Edit, Write and NotebookEdit, severity BLOCK. Refuses a write to
      a file the remote trunk has committed to since this tree diverged, above a
      configurable drift floor. THE DEFECT IS GIT-MECHANICAL AND UNIVERSAL. A stale
      checkout is INDISTINGUISHABLE from a fresh one by inspection. Every file is
      present, every path resolves, every edit applies, so nothing signals the
      staleness until the content ships. In the originating incident a session wrote
      hooks, a rule and fixtures into a primary checkout 1,574 commits behind the
      remote trunk, and edited the harness settings file there. The destination copy
      of that settings file carried two hook registrations the stale copy lacked, so
      copying it forward would have SILENTLY DELETED TWO SECURITY GUARDS. It was
      caught by a diff run on a hunch. No control existed that would have caught it.
      WHY BLOCK SEVERITY IS DEFENSIBLE, AND WHY THAT REASONING MUST TRAVEL WITH IT.
      Every input is git PROCESS STATE, namely rev-list counts and cat-file and
      diff-quiet exit codes, not a regex over a command string and not prose. That
      is the bar the hook-output-discipline rule sets for block. Its sibling below
      is deliberately NOT block for exactly the opposite reason. Offering the pair
      without that distinction invites a consumer to promote the wrong one. THE
      THREE GUARD-AUTHORING BUGS ARE THE MOST VALUABLE PART OF THIS PAYLOAD. All
      three were found by the fixtures and NONE by review, and a consumer
      re-implementing this from the description alone would hit each one. First, the
      whole-hook time budget was anchored at MODULE LOAD, so it could expire before
      the evaluation function was ever called, producing a guard that fails open for
      reasons unrelated to its own check. It must be per-invocation. Second, the
      containment test compared the symlink-resolved repository root against an
      UNRESOLVED candidate path, so the relative path began with a parent traversal
      and the guard SILENTLY FAILED OPEN on macOS for any repository whose path
      crosses a symlink. Both sides must go through the same resolver, per the
      path-containment discipline. Third, and worst, THE PREDICATE ITSELF WAS WRONG
      ON THE FIRST ATTEMPT. It asked whether the file differs from the trunk AND the
      current branch has NOT touched it, treating a branch-touched file as
      work-in-progress. Run against the actual incident it FAILED OPEN, allowing the
      exact edit it existed to prevent, because the stale branch HAD touched the
      file. Both sides having touched a file is DIVERGENCE, which is strictly more
      dangerous than a one-sided difference. The corrected predicate asks only
      whether the trunk holds commits to that file which this tree lacks.
      CONSUMER CONFIGURATION REQUIRED, and a consumer who skips it gets a guard that
      never fires. The trunk ref is currently a hardcoded origin-main string and
      must become resolved or configurable, since a consumer on a differently-named
      trunk or remote silently gets nothing. The drift floor is a measured local
      value and each consumer must set their own, because too low fires on normal
      work and too high misses the case it exists for. An environment-variable
      override already exists and should be documented, since a guard with no escape
      hatch gets commented out of the settings file the first time someone genuinely
      needs it off, and after that it protects nothing.
  - file: .claude/hooks/trunk-worktree-guard.js
    action: added
    reason: >-
      PreToolUse on Bash, severity halt-and-report and deliberately NOT block, because
      its signal is a PARSED COMMAND STRING, which the hook-output-discipline rule
      forbids from carrying block on the grounds that shell expansion is invisible
      before execution. It surfaces a worktree-add that would attach the trunk BRANCH,
      and names the two correct forms, a detached checkout of the remote trunk for
      inspection and a new branch cut from the remote trunk for work. THIS IS THE ROOT
      CAUSE BENEATH THE STALE-TREE SYMPTOM, which is why the pair ships together. Git
      enforces one-branch-one-worktree, so a worktree holding the trunk branch makes
      the primary checkout STRUCTURALLY UNABLE to be on the trunk. Checking out the
      trunk there fails with a message naming the holding worktree, so the primary
      parks on a feature branch and drifts from then on. Three further defects
      compound it and are recorded in the rule. A local trunk branch can track the
      WRONG upstream ref, so even a pull on the trunk fetches a different branch.
      Nothing measures the staleness of the tree being WRITTEN INTO, and an
      accumulation census is a different axis that cannot catch it. And enough
      accumulated worktrees and unmerged commits make the parked branch LOOK like
      legitimate work. The static trunk-name set is already generic. Consumer
      configuration required. None.
  - file: .claude/rules/stale-tree-discipline.md
    action: added
    reason: >-
      The paired rule for the two guards above. The guards enforce the first and third
      clauses structurally, the second and fourth are gate-review. Four clauses. ONE, a
      worktree must not hold the trunk branch, since both correct forms give identical
      tree contents without taking the branch hostage. TWO, the primary checkout stays
      on the trunk, current and clean, verified at session start by three commands,
      namely the current branch, the branch's configured upstream ref, and a count of
      commits the remote trunk holds that this tree lacks. The upstream-ref check is
      there because it is the one defect that survives a pull. THREE, verify the tree
      BEFORE writing into it rather than after, because the presence of a file says
      nothing whatever about its version. FOUR, copying a file between trees IS A MERGE
      and must be treated as one. Diff both versions and reconcile deliberately, or
      move the work by branch and merge, which is what the tool is for. The fourth
      clause is the one that would have prevented the actual damage. The edit itself
      was harmless; the copy forward is what would have deleted two security guards.
      Each clause carries its own worked example, its blocked-rationalization corpus
      and its rationale, and the file closes with a map distinguishing it from the
      accumulation census, from interpreter-resolution wrong-tree failures, from the
      path-containment resolver requirement, and from the same staleness class at the
      merge boundary, which is strictly later than the write boundary this covers.
