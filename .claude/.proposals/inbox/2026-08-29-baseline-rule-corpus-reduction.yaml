  # GROUP 2 — the two missing corpus detectors.
  #
  # Independent of the byte reduction and, in the proposer's assessment, of
  # comparable value: both are generic corpus instruments with no project
  # coupling, and each closes a class the corpus could not previously see.
  # -------------------------------------------------------------------------
  - file: .claude/bin/detection-binding-check.mjs
    action: created
    base_version: "2.24.0"
    diff_lines: "+399 -0"
    reason: >-
      The detector for coc-artifact-eval-coverage.md MUST-4 (the artifact-to-harness
      binding). Its 16 fixture cases were committed long before any scanner
      existed to run them, so nothing ever ran them - the detector whose job is
      catching rules that claim nonexistent detectors was itself a nonexistent
      detector. Answers one question only: does a rule's declared harness binding
      EXIST on disk, across exactly three namespaces (bin scanners, audit
      fixtures, test-harness probes). Deliberately treats `.claude/hooks/**` as
      NON-binding and says so, because whether a declared detector is actually
      DISPATCHED is a different proposition needing a different instrument; it
      reports that as out of scope rather than half-answering it. Fails closed on
      an unclassified namespace. Re-derived by the proposer against a 124-rule
      corpus: 10 critical findings, including two dangling probe bindings and
      four dangling fixture bindings.

