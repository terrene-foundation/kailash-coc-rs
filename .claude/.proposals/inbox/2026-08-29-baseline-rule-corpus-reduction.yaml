    diff_lines: "+56 -8"
    reason: >-
      Project-specific CI. Wires this repo's own previously-unrun fixture suites
      into this repo's own required gate, on a self-hosted runner pool the
      template does not have, and its inline evidence counts are inventories of
      this repo's fixture tree. The METHOD is generic and worth stating in prose -
      inventory your audit-fixtures directory, find the suites no workflow
      invokes, run them, wire only the green ones, and triage the reds separately
      rather than wiring a known-red suite as a blocking step. The FILE is not
      portable and is excluded.
