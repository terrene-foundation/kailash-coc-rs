  - file: .claude/bin/scan-synced-disclosure.mjs
    action: modified
    base_version: "2.24.0"
    reason: >-
      TWO defects in the Gate-2 disclosure fence, one of which meant a whole
      directory tree had NEVER been scanned. (a) SYMLINKED-DIRECTORY WALK:
      readdirSync(withFileTypes) reports the LINK, not its target, so a symlink to a
      DIRECTORY has isDirectory() === false, falls through to the isSymbolicLink()
      branch, and is pushed as a FILE; readFileSync then throws EISDIR and the catch
      dropped it. collectFiles walks `.claude/` only, so for any consumer whose
      `.claude/<name>` is a symlink to an out-of-`.claude` directory, that symlink is
      the ONLY route its files have onto the scanned surface — and they never
      arrived. Measured on one consumer: 2450 files scanned before, 2458 after, i.e.
      8 files (including a policy JSON and a dump JSON) had never been disclosure-
      scanned, while the tool printed "RESULT: clean — 0 findings. This is the
      structural receipt that the #252 disclosure forest is closed on this surface."
      Fix resolves a symlink with statSync (which follows) rather than trusting the
      dirent, recurses into an in-tree symlinked directory, and applies
      security.md § Path Containment — BOTH target and scan root through realpathSync
      before comparison, an escaping link recorded as a finding rather than followed,
      plus a WALKED_REAL_DIRS set so a link to an ancestor cannot recurse forever.
      (b) TWO SWALLOWING CATCHES: walk()'s readdir and scanFile()'s readFile each did
      a bare `return`, so an unreadable path left the scanned surface with no trace
      while the "forest is closed" receipt still printed. Both now record into an
      UNREADABLE accumulator, and a non-empty accumulator is a FATAL exit 2 evaluated
      BEFORE either verdict path — the coverage assertion the sibling JS sweep already
      has. A skipped path and a clean path are otherwise the same bytes downstream.
    diff_lines: "+68"
  - file: .claude/bin/lib/identity-scrub.mjs
    action: modified
    base_version: "2.24.0"
    reason: >-
      TWO defects in the shared identity-extraction lib both fences depend on.
      (a) readTextOrNull COLLAPSES "this file is binary, skip it by design" and "this
      file could not be opened at all" into ONE null. Its only caller is
      clean-instantiate's assertZero — the FAIL-CLOSED gate whose entire promise is
      that ZERO canon trust-identity remains in a client clone — so an unreadable
      carrier of canon identity was skipped and the ceremony still reported clean.
      Adds readTextOrReason returning {text, reason: "ok"|"binary"|"unreadable",
      error}; readTextOrNull is kept as a thin wrapper so no other caller changes.
      Bipolar control on ordinary filenames: ok / binary(NUL) / EACCES / ENOENT all
      classified correctly, binary vs unreadable DISTINGUISHED, back-compat unchanged.
      (b) assertNoSymlinkEscape is an ORPHAN — `git grep` returns its definition and
      NOTHING else, while its own docstring asserts "callers assert BEFORE their first
      destructive/tree-walking step" and names the clean-instantiate CLEAR ceremony as
      the case it closes. The two consumers it was written for do not exist in a
      consumer tree at all. It was relocated into this lib by an earlier redteam fix
      and has never run once. This is the vacuous-control class ONE LEVEL UP: not a
      control that executes without checking, but a control that never executes. Worth
      a register axis of its own — when auditing a guard, check REACHABILITY before
      correctness.
    diff_lines: "+34"
  - file: .claude/bin/clean-instantiate.mjs
    action: modified
    base_version: "2.24.0"
    reason: >-
      assertZero — the fail-closed gate certifying a client clone carries zero canon
      identity — walks the tree with walkFiles, which resolves entries via statSync
      and therefore FOLLOWS symlinks, and it never called the symlink-escape guard
