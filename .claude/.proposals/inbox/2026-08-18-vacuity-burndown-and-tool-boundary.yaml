  - file: .claude/rules/tool-boundary-discipline.md
    action: proposed
    base_version: "2.24.0"
    reason: >-
      NEW RULE proposed from six blocked tool calls in one session, five of which were
      the guard being RIGHT. The state-protecting guards decide on the COMMAND STRING:
      two are deliberately UNANCHORED (matching a protected path or file-util verb
      anywhere in the string, because anchoring makes them bypassable) and one FAILS
      CLOSED on a suffix when no git root resolves. That design is correct, and its
      consequence is that PROSE DESCRIBING a protected operation is indistinguishable
      from the operation, and a FIXTURE MIMICKING a protected shape is
      indistinguishable from the real thing. Three MUSTs, each measured: (1) never
      place prose in a Bash command body — author content with the file-write tool and
      pass it by reference; a commit-message heredoc mentioning `chmod` and an
      interpreter heredoc mentioning a roster path both blocked, and detailed commit
      bodies make a match near-certain; (2) never build a fixture that recreates a
      protected filename — the guard that protects the real file correctly fails
      closed on the lookalike; (3) never truncate-read a continuity artifact. Plus the
      meta-clause that is the most valuable part: WHEN REMEDIATING A BLOCK, NAME THE
      CLASS, NOT THE INSTANCE. The originating session wrote down "never use an
      interpreter heredoc to edit files", then was blocked again on a commit-message
      heredoc — the identical defect the vacuous-control epic is about, committed
      against its own remediation. Also proposes the default reading of a block:
      first hypothesis is that you produced the shape the guard exists to stop, not
      that it misfired. Trust-posture wiring to be authored at Gate-1 placement, since
      severity and detection depend on which layer the template lands it in.
    diff_lines: "new rule"
