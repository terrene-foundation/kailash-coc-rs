  - file: .claude/commands/sync-from-template.md
    action: proposed
    base_version: "2.24.0"
    reason: >-
      CONTRACT AMBIGUITY that made this whole cycle's durability unknowable, and the
      highest-value item in this batch. § "Merge Semantics" states the general rule
      "If a file exists in BOTH the template and this repo, the template version
      wins", while § 5 enumerates "Updated from template" as agents/, commands/,
      rules/, skills/, guides/ and .claude/hooks/ — and names NEITHER
      `.claude/bin/**` NOR `.claude/audit-fixtures/**`. The Preserved list ends with
      "Any file/directory not present in the template", which does not resolve it
      either. A consumer that fixes a defect in `.claude/bin/**` therefore cannot
      tell whether the fix survives the next sync. Concretely: this cycle fixed eight
      such files, and whether that work persists locally is UNDETERMINED by the
      written contract. Requested: make § 5 exhaustive — state explicitly, for
      `.claude/bin/**` and `.claude/audit-fixtures/**`, whether they are Updated or
      Preserved. Either answer is workable; the ambiguity is not, because it decides
      whether a consumer should fix-and-keep or fix-and-upflow, and getting it wrong
      silently discards the work.
    diff_lines: "0 (contract clarification)"
